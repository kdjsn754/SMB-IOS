name: SMBViewer

options:
  bundleIdPrefix: com.smbviewer
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    GCC_WARN_UNDECLARED_SELECTOR: NO
    SWIFT_EMIT_LOC_STRINGS: NO

# AMSMB2 已 vendor 到仓库内（Packages/AMSMB2），并改成静态链接：
# 避免 IPA 里出现 Frameworks/AMSMB2.framework，被自签工具漏签导致启动闪退。
packages:
  AMSMB2:
    path: Packages/AMSMB2

targets:
  SMBViewer:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources
    dependencies:
      - package: AMSMB2
    settings:
      base:
        PRODUCT_NAME: SMBViewer
        PRODUCT_BUNDLE_IDENTIFIER: com.smbviewer.app
        MARKETING_VERSION: "1.4.7"
        CURRENT_PROJECT_VERSION: "83"
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

schemes:
  SMBViewer:
    build:
      targets:
        SMBViewer: all
    run:
      config: Debug
    archive:
      config: Release
