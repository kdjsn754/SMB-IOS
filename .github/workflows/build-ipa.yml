name: 构建未签名 IPA
run-name: 构建未签名 IPA · ${{ github.ref_name }}

# 镜像说明：
#   xcode-27 = macOS 27 + Xcode 27（镜像默认 Xcode 即 27.x，SDK 为 iOS 27）
#   想改回旧版：把 runs-on 换成 macos-26 / macos-15，并把 XCODE_VERSION 改成对应主版本号
#
# 注意：Actions 页面里的「Set up job」「Post Checkout」「Complete job」是 GitHub 内置步骤，
#       名字由平台固定生成，无法改成中文，其余步骤名都是下面自定的。
env:
  XCODE_VERSION: "27"

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 SMBViewer（Xcode 27 · 不签名）
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
      # 末尾「清理历史产物」要删旧 artifact，需要 actions: write
      actions: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看运行器信息
        run: |
          set -euo pipefail
          sw_vers
          echo "== 镜像里的 Xcode =="
          ls -d /Applications/Xcode*.app || true

      - name: 选择 Xcode 27
        run: |
          set -euo pipefail
          echo "目标主版本：$XCODE_VERSION"
          # 优先正式版（跳过 beta），同主版本号取最新的
          pick=""
          for app in $(ls -d /Applications/Xcode_${XCODE_VERSION}*.app 2>/dev/null | sort -V); do
            case "$app" in
              *[Bb]eta*) continue ;;
              *) pick="$app" ;;
            esac
          done
          # 没有正式版就退回 beta / 其它命名（例如 Xcode_27_beta_3.app）
          if [ -z "$pick" ]; then
            pick=$(ls -d /Applications/Xcode_${XCODE_VERSION}*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$pick" ]; then
            echo "::error::镜像上没有找到 Xcode ${XCODE_VERSION}，可用版本见上一步列表"
            exit 1
          fi

          echo "== 使用 $pick =="
          sudo xcode-select -s "$pick/Contents/Developer"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          swift --version 2>&1 | head -2

      # Xcode 27 预览镜像可能没带 Metal 工具链（actool 编译图标时会报 missing Metal Toolchain）
      - name: 准备 Metal 工具链
        continue-on-error: true
        timeout-minutes: 15
        run: |
          if xcrun -f metal >/dev/null 2>&1; then
            echo "Metal 工具链已就绪：$(xcrun -f metal)"
          else
            echo "缺少 Metal 工具链，尝试下载"
            xcodebuild -downloadComponent MetalToolchain || echo "下载失败，继续构建（本项目不需要 Metal 着色器）"
          fi

      - name: 安装 XcodeGen
        run: |
          brew update --quiet || true
          brew install xcodegen
          xcodegen --version

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 解析 Swift 依赖
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SMBViewer.xcodeproj \
            -scheme SMBViewer \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm"

      - name: 归档构建（不签名）
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SMBViewer.xcodeproj \
            -scheme SMBViewer \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/SMBViewer.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

      - name: 打包 IPA
        run: |
          APP="$RUNNER_TEMP/SMBViewer.xcarchive/Products/Applications/SMBViewer.app"
          if [ ! -d "$APP" ]; then
            echo "找不到构建产物 SMBViewer.app"
            ls -R "$RUNNER_TEMP/SMBViewer.xcarchive/Products" || true
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          rm -rf build/Payload/SMBViewer.app/_CodeSignature
          find build/Payload -name "embedded.mobileprovision" -delete
          cd build
          zip -qry SMBViewer-unsigned.ipa Payload
          ls -lh SMBViewer-unsigned.ipa

      - name: 输出 IPA 信息
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SMBViewer.xcarchive/Products/Applications/SMBViewer.app"
          INFO="$APP/Info.plist"
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO" || true)"
          echo "最低系统: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$INFO" || true)"
          echo "版本号: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO" || true) ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO" || true))"
          echo "可执行文件: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO" || true)"
          otool -L "$APP/SMBViewer" | head -20 || true

      # 闪退排查用：确认包结构、动态库依赖、rpath、签名状态
      - name: 自检：包结构与依赖
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SMBViewer.xcarchive/Products/Applications/SMBViewer.app"
          INFO="$APP/Info.plist"
          echo "=== .app 结构 ==="
          find "$APP" -maxdepth 3 -not -path "*/_CodeSignature/*" | sed "s|$APP|.|" | head -40
          echo
          echo "=== 内嵌框架 ==="
          if [ -d "$APP/Frameworks" ]; then
            ls -la "$APP/Frameworks" || true
            for fw in "$APP/Frameworks"/*.framework; do
              [ -e "$fw" ] || continue
              echo "--- $fw"
              otool -L "$fw/$(basename "$fw" .framework)" | head -5 || true
            done
          else
            echo "没有 Frameworks 目录 —— 静态链接生效 ✅"
          fi
          echo
          # 关键断言：AMSMB2 必须被静态链接进来，否则自签工具会漏签导致启动闪退
          if [ -d "$APP/Frameworks/AMSMB2.framework" ]; then
            echo "::error::AMSMB2 仍然是动态框架（IPA 里有 Frameworks/AMSMB2.framework），自签后会漏签闪退。请检查 Packages/AMSMB2/Package.swift 的 product type 是否为 .static"
            exit 1
          fi
          if ! otool -L "$APP/SMBViewer" | grep -q "AMSMB2.framework"; then
            echo "AMSMB2.framework 未作为动态库出现在主程序依赖里 ✅"
          fi
          echo
          echo "=== LC_RPATH / 依赖 ==="
          otool -l "$APP/SMBViewer" | grep -A2 LC_RPATH | head -20 || true
          echo
          echo "=== 签名状态（未签名应有 CodeSignature 缺失提示）==="
          codesign -dvvv "$APP" 2>&1 | head -8 || true
          echo
          echo "=== Info.plist 关键键 ==="
          for k in CFBundlePackageType CFBundleSupportedPlatforms MinimumOSVersion UIDeviceFamily UIApplicationSceneManifest UILaunchScreen; do
            printf '%s = ' "$k"
            /usr/libexec/PlistBuddy -c "Print :$k" "$INFO" 2>/dev/null || echo "(缺失)"
          done

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: SMBViewer-unsigned-ipa
          path: build/SMBViewer-unsigned.ipa
          if-no-files-found: error
          # 每次发版都会生成一份，仓库里只留最近几份（见下一步），这里不设太长
          retention-days: 14

      # 仓库只保留最近 5 份产物，更早的自动删除（避免 Actions 存储无限增长）
      - name: 清理历史产物（只留最近 5 个）
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          keep = 5

          def call(url, method="GET"):
              req = urllib.request.Request(url, method=method, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "smbviewer-ci",
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read()
                  return json.loads(body) if body else None

          data = call("https://api.github.com/repos/%s/actions/artifacts?per_page=100" % repo)
          arts = sorted(data.get("artifacts", []), key=lambda a: a["id"], reverse=True)
          print("现有产物 %d 个，保留最新 %d 个" % (len(arts), keep))
          for a in arts[keep:]:
              print("  删除 #%s %s（%s）" % (a["id"], a["name"], a["created_at"]))
              call("https://api.github.com/repos/%s/actions/artifacts/%s" % (repo, a["id"]), "DELETE")
          print("清理完成")
          PY
