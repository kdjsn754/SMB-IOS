name: 构建未签名 IPA
run-name: 构建未签名 IPA · ${{ github.ref_name }}

# 镜像说明：
#   xcode-27 = macOS 27 + Xcode 27（镜像默认 Xcode 即 27.x，SDK 为 iOS 27）
#   想改回旧版：把 runs-on 换成 macos-26 / macos-15，并把 XCODE_VERSION 改成对应主版本号
#
# 注意：Actions 页面里的「Set up job」「Post Checkout」「Complete job」是 GitHub 内置步骤，
#       名字由平台固定生成，无法改成中文，其余步骤名都是下面自定的。
env:
  XCODE_VERSION: "27"

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 SMBViewer（Xcode 27 · 不签名）
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看运行器信息
        run: |
          set -euo pipefail
          sw_vers
          echo "== 镜像里的 Xcode =="
          ls -d /Applications/Xcode*.app || true

      - name: 选择 Xcode 27
        run: |
          set -euo pipefail
          echo "目标主版本：$XCODE_VERSION"
          # 优先正式版（跳过 beta），同主版本号取最新的
          pick=""
          for app in $(ls -d /Applications/Xcode_${XCODE_VERSION}*.app 2>/dev/null | sort -V); do
            case "$app" in
              *[Bb]eta*) continue ;;
              *) pick="$app" ;;
            esac
          done
          # 没有正式版就退回 beta / 其它命名（例如 Xcode_27_beta_3.app）
          if [ -z "$pick" ]; then
            pick=$(ls -d /Applications/Xcode_${XCODE_VERSION}*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$pick" ]; then
            echo "::error::镜像上没有找到 Xcode ${XCODE_VERSION}，可用版本见上一步列表"
            exit 1
          fi

          echo "== 使用 $pick =="
          sudo xcode-select -s "$pick/Contents/Developer"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          swift --version 2>&1 | head -2

      # Xcode 27 预览镜像可能没带 Metal 工具链（actool 编译图标时会报 missing Metal Toolchain）
      - name: 准备 Metal 工具链
        continue-on-error: true
        timeout-minutes: 15
        run: |
          if xcrun -f metal >/dev/null 2>&1; then
            echo "Metal 工具链已就绪：$(xcrun -f metal)"
          else
            echo "缺少 Metal 工具链，尝试下载"
            xcodebuild -downloadComponent MetalToolchain || echo "下载失败，继续构建（本项目不需要 Metal 着色器）"
          fi

      - name: 安装 XcodeGen
        run: |
          brew update --quiet || true
          brew install xcodegen
          xcodegen --version

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 解析 Swift 依赖
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SMBViewer.xcodeproj \
            -scheme SMBViewer \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm"

      - name: 归档构建（不签名）
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SMBViewer.xcodeproj \
            -scheme SMBViewer \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/SMBViewer.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

      - name: 打包 IPA
        run: |
          APP="$RUNNER_TEMP/SMBViewer.xcarchive/Products/Applications/SMBViewer.app"
          if [ ! -d "$APP" ]; then
            echo "找不到构建产物 SMBViewer.app"
            ls -R "$RUNNER_TEMP/SMBViewer.xcarchive/Products" || true
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          rm -rf build/Payload/SMBViewer.app/_CodeSignature
          find build/Payload -name "embedded.mobileprovision" -delete
          cd build
          zip -qry SMBViewer-unsigned.ipa Payload
          ls -lh SMBViewer-unsigned.ipa

      - name: 输出 IPA 信息
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SMBViewer.xcarchive/Products/Applications/SMBViewer.app"
          INFO="$APP/Info.plist"
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO" || true)"
          echo "最低系统: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$INFO" || true)"
          echo "版本号: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO" || true) ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO" || true))"
          echo "可执行文件: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO" || true)"
          otool -L "$APP/SMBViewer" | head -20 || true

      # 闪退排查用：确认包结构、动态库依赖、rpath、签名状态
      - name: 自检：包结构与依赖
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SMBViewer.xcarchive/Products/Applications/SMBViewer.app"
          INFO="$APP/Info.plist"
          echo "=== .app 结构 ==="
          find "$APP" -maxdepth 3 -not -path "*/_CodeSignature/*" | sed "s|$APP|.|" | head -40
          echo
          echo "=== 内嵌框架 ==="
          if [ -d "$APP/Frameworks" ]; then
            ls -la "$APP/Frameworks" || true
            for fw in "$APP/Frameworks"/*.framework; do
              [ -e "$fw" ] || continue
              echo "--- $fw"
              otool -L "$fw/$(basename "$fw" .framework)" | head -5 || true
            done
          else
            echo "没有 Frameworks 目录（SPM 可能被静态链接）"
          fi
          echo
          echo "=== LC_RPATH / 依赖 ==="
          otool -l "$APP/SMBViewer" | grep -A2 LC_RPATH | head -20 || true
          echo
          echo "=== 签名状态（未签名应有 CodeSignature 缺失提示）==="
          codesign -dvvv "$APP" 2>&1 | head -8 || true
          echo
          echo "=== Info.plist 关键键 ==="
          for k in CFBundlePackageType CFBundleSupportedPlatforms MinimumOSVersion UIDeviceFamily UIApplicationSceneManifest UILaunchScreen; do
            printf '%s = ' "$k"
            /usr/libexec/PlistBuddy -c "Print :$k" "$INFO" 2>/dev/null || echo "(缺失)"
          done

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: SMBViewer-unsigned-ipa
          path: build/SMBViewer-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 附加 IPA 到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/SMBViewer-unsigned.ipa
          generate_release_notes: true
